name: Security Gate

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build triage-bot jar
        run: mvn -q clean package -DskipTests

      - name: Start triage service
        run: |
          nohup java -jar target/triage-bot-0.1.0.jar > app.log 2>&1 &
          for i in $(seq 1 15); do
            curl -s http://localhost:8080/api/report > /dev/null && break
            sleep 2
          done

      - name: Ingest sample findings
        run: |
          curl -X POST "http://localhost:8080/api/ingest?sourceRoot=${{ github.workspace }}/src" \
            -H "Content-Type: application/json" \
            --data @sample-report.json

      - name: Get ranked report
        run: curl -s http://localhost:8080/api/report -o report.json

      - name: Post PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY=$(python3 -c "
          import json
          data = json.load(open('report.json'))
          lines = ['| CVE | Dependency | CVSS | Reachable | Risk Score |', '|---|---|---|---|---|']
          for f in data:
              lines.append(f\"| {f['cveId']} | {f['dependencyName']} | {f['cvssScore']} | {f['reachable']} | {round(f['riskScore'], 2)} |\")
          print(chr(10).join(lines))
          ")
          BODY="### Reachability-Aware Vulnerability Triage

          $SUMMARY"
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'body': sys.argv[1]}))" "$BODY")"